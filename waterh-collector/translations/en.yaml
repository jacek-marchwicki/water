configuration:
  bottle_address:
    name: "Bottle Bluetooth MAC Address"
    description: "Bluetooth MAC address of your WaterH bottle. Can be read from the official WaterH mobile app at the bottom of the screen (e.g. A4:C1:38:F3:63:2D)."
  poll_interval:
    name: "Poll Interval (seconds)"
    description: "Polling interval in seconds between Bluetooth sync cycles."
  goal_ml:
    name: "Daily Intake Goal (mL)"
    description: "Target daily water intake goal in mL."
  mqtt_host:
    name: "MQTT Host"
    description: "Hostname or IP of your Mosquitto MQTT broker."
  mqtt_port:
    name: "MQTT Port"
    description: "Port of your MQTT broker (default 1883)."
  mqtt_user:
    name: "MQTT Username"
    description: "MQTT username (auto-retrieved by Home Assistant Supervisor if left blank)."
  mqtt_password:
    name: "MQTT Password"
    description: "MQTT password (auto-retrieved by Home Assistant Supervisor if left blank)."
  mqtt_topic_prefix:
    name: "MQTT Topic Prefix"
    description: "Discovery topic prefix for Home Assistant (default: homeassistant)."
